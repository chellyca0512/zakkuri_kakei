<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ざっくり予算帳</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#222;--sub:#777;--line:#ddd;--accent:#365f78;--danger:#a54a4a;--ok:#4f7659}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;font-size:15px}
header{padding:18px 16px 10px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 4px}.date{color:var(--sub);font-size:13px}
main{padding:14px 14px 88px;max-width:700px;margin:auto}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}.muted{color:var(--sub)}
.big{font-size:26px;font-weight:700}.row{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#fafafa;border-radius:10px;padding:10px}.metric small{display:block;color:var(--sub)}.metric strong{display:block;font-size:18px;margin-top:4px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;background:#fff}textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:9px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:600}.secondary{background:#eee;color:#333}.danger{background:#fff;color:var(--danger);border:1px solid #ddd}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{background:#fff;color:#555;border-radius:0;padding:9px 4px;flex:1;max-width:140px;font-size:11px}.nav button.active{color:var(--accent);font-weight:700}
.item{border-top:1px solid var(--line);padding:11px 0}.item:first-child{border-top:0}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#edf1f3;font-size:11px;margin-left:5px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}.dow,.day{min-height:65px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;font-size:11px}.dow{min-height:auto;text-align:center;background:#fafafa;color:var(--sub)}.day:nth-child(7n){border-right:0}.day b{font-size:12px}.event{font-size:10px;margin-top:4px;background:#eef3f5;border-radius:5px;padding:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.over{color:var(--danger)}.ok{color:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:22px}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>ざっくり予算帳</h1><div class="date">細かい家計簿ではなく、大きな予定・支出を管理</div></header>
<main>
<section id="home" class="tab active">
  <div class="card"><h2>10月の状況</h2><div class="grid">
    <div class="metric"><small>予算</small><strong id="mBudget">¥0</strong></div>
    <div class="metric"><small>予定</small><strong id="mPlan">¥0</strong></div>
    <div class="metric"><small>実績</small><strong id="mActual">¥0</strong></div>
  </div><div class="row"><span>予算残り</span><strong id="mRemain">¥0</strong></div></div>
  <div class="card"><h2>記録する</h2>
    <div class="formgrid">
      <div class="full"><label>ひとこと入力</label><textarea id="quick" placeholder="例：10/12 友人と遊び 5,000円"></textarea></div>
      <div><label>日付</label><input id="date" type="date"></div>
      <div><label>金額</label><input id="amount" type="number" inputmode="numeric" placeholder="5000"></div>
      <div><label>内容</label><input id="title" placeholder="友人と遊び"></div>
      <div><label>カテゴリ</label><input id="cat" placeholder="交際費 / 推し活 / 自転車"></div>
      <div><label>誰と（任意）</label><input id="person" placeholder="友人A"></div>
      <div><label>状態</label><select id="status"><option value="actual">実績</option><option value="planned">予定</option></select></div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px"><button onclick="parseQuick()">文章から入力</button><button class="secondary" onclick="addItem()">登録</button></div>
    <div class="muted" style="margin-top:8px;font-size:12px">文章入力は試作品なので、日付・金額・内容を簡単に拾うだけです。</div>
  </div>
  <div class="card"><h2>最近の記録</h2><div id="recent"></div></div>
</section>

<section id="calendar" class="tab">
  <div class="card"><div class="row"><button class="secondary" onclick="changeMonth(-1)">←</button><strong id="calTitle"></strong><button class="secondary" onclick="changeMonth(1)">→</button></div><div id="calendarGrid" class="calendar"></div></div>
</section>

<section id="month" class="tab">
  <div class="card"><h2>10月の収支</h2><div class="grid">
    <div class="metric"><small>予算</small><strong id="mmBudget">¥0</strong></div>
    <div class="metric"><small>予定</small><strong id="mmPlan">¥0</strong></div>
    <div class="metric"><small>実績</small><strong id="mmActual">¥0</strong></div>
  </div><div id="monthCats"></div></div>
  <div class="card"><h2>今月の記録</h2><div id="monthItems"></div></div>
</section>

<section id="year" class="tab">
  <div class="card"><h2>2026年 / シーズン</h2><div class="grid">
    <div class="metric"><small>年間予算</small><strong id="yBudget">¥0</strong></div>
    <div class="metric"><small>予定</small><strong id="yPlan">¥0</strong></div>
    <div class="metric"><small>実績</small><strong id="yActual">¥0</strong></div>
  </div></div>
  <div class="card"><h2>シーズン別</h2><div id="seasons"></div></div>
  <div class="card"><h2>年間カテゴリ別</h2><div id="yearCats"></div></div>
</section>

<section id="category" class="tab">
  <div class="card"><h2>カテゴリ別</h2><div id="categories"></div></div>
</section>
</main>
<nav class="nav">
<button class="active" onclick="showTab('home',this)">ホーム</button>
<button onclick="showTab('calendar',this)">カレンダー</button>
<button onclick="showTab('month',this)">今月</button>
<button onclick="showTab('year',this)">年間</button>
<button onclick="showTab('category',this)">カテゴリ</button>
</nav>

<script>
let items=JSON.parse(localStorage.getItem('budgetItems')||'[]');
let view=new Date(); view.setDate(1);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
function save(){localStorage.setItem('budgetItems',JSON.stringify(items));render()}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function monthKey(d){return d.slice(0,7)}
function currentMonth(){return '2026-10'}
function addItem(){
 let q=document.getElementById('quick').value.trim();
 let date=document.getElementById('date').value||'2026-10-01';
 let amount=Number(document.getElementById('amount').value||0);
 let title=document.getElementById('title').value.trim()||'未分類';
 let cat=document.getElementById('cat').value.trim()||'その他';
 let person=document.getElementById('person').value.trim();
 let status=document.getElementById('status').value;
 if(q && !amount) return parseQuick();
 if(!amount){alert('金額を入力してください');return}
 items.unshift({id:Date.now(),date,amount,title,cat,person,status});
 ['quick','amount','title','cat','person'].forEach(id=>document.getElementById(id).value='');
 save();
}
function parseQuick(){
 let q=document.getElementById('quick').value.trim(); if(!q)return;
 let dm=q.match(/(?:^|\\D)(\\d{1,2})[\\/月](\\d{1,2})?/);
 let am=q.match(/([0-9][0-9,]*)\\s*円/);
 if(am)document.getElementById('amount').value=am[1].replace(/,/g,'');
 if(dm){let mo=String(dm[1]).padStart(2,'0'),da=String(dm[2]||1).padStart(2,'0');document.getElementById('date').value=`2026-${mo}-${da}`;}
 else document.getElementById('date').value='2026-10-01';
 let clean=q.replace(/(?:^|\\D)\\d{1,2}[\\/月]\\d{1,2}/,'').replace(/[0-9][0-9,]*\\s*円/,'').trim();
 document.getElementById('title').value=clean||'未分類';
 document.getElementById('cat').value='';
}
function totals(list){return {plan:list.filter(x=>x.status==='planned').reduce((a,x)=>a+x.amount,0),actual:list.filter(x=>x.status==='actual').reduce((a,x)=>a+x.amount,0)}}
function render(){
 let m=currentMonth(), mi=items.filter(x=>x.date.startsWith(m)), t=totals(mi);
 ['mPlan','mmPlan'].forEach(id=>document.getElementById(id).textContent=yen(t.plan));
 ['mActual','mmActual'].forEach(id=>document.getElementById(id).textContent=yen(t.actual));
 ['mBudget','mmBudget'].forEach(id=>document.getElementById(id).textContent='未設定');
 document.getElementById('mRemain').textContent='予算未設定';
 document.getElementById('recent').innerHTML=items.slice(0,6).map(row).join('')||'<div class="empty">まだ記録がありません</div>';
 document.getElementById('monthItems').innerHTML=mi.map(row).join('')||'<div class="empty">10月の記録はありません</div>';
 let cats={};mi.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);
 document.getElementById('monthCats').innerHTML='<h2 style="margin-top:18px">カテゴリ別</h2>'+Object.entries(cats).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><strong>${yen(v)}</strong></div>`).join('')||'<div class="empty">なし</div>';
 renderCalendar(); renderYear(); renderCategories();
}
function row(x){return `<div class="item"><div><strong>${esc(x.title)}</strong> <span class="pill">${x.status==='planned'?'予定':'実績'}</span></div><div>${esc(x.date)} ${x.person?'・'+esc(x.person):''} <strong style="float:right">${yen(x.amount)}</strong></div><div class="muted">${esc(x.cat)}</div></div>`}
function renderCalendar(){
 let y=view.getFullYear(),m=view.getMonth();document.getElementById('calTitle').textContent=`${y}年${m+1}月`;
 let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 let h=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');
 for(let i=0;i<first;i++)h+='<div class="day"></div>';
 for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, es=items.filter(x=>x.date===ds);h+=`<div class="day"><b>${d}</b>${es.map(x=>`<div class="event">${esc(x.title)} ${yen(x.amount)}</div>`).join('')}</div>`}
 document.getElementById('calendarGrid').innerHTML=h;
}
function changeMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}
function renderYear(){
 let t=totals(items);document.getElementById('yBudget').textContent='未設定';document.getElementById('yPlan').textContent=yen(t.plan);document.getElementById('yActual').textContent=yen(t.actual);
 let seasons={春:0,夏:0,秋:0,冬:0};items.forEach(x=>{let m=Number(x.date.slice(5,7));let s=m<=5?'春':m<=8?'夏':m<=11?'秋':'冬';seasons[s]+=x.amount});
 document.getElementById('seasons').innerHTML=Object.entries(seasons).map(([k,v])=>`<div class="row"><span>${k}</span><strong>${yen(v)}</strong></div>`).join('');
 let cats={};items.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);
 document.getElementById('yearCats').innerHTML=Object.entries(cats).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><strong>${yen(v)}</strong></div>`).join('')||'<div class="empty">なし</div>';
}
function renderCategories(){
 let cats={};items.forEach(x=>{if(!cats[x.cat])cats[x.cat]=[];cats[x.cat].push(x)});
 document.getElementById('categories').innerHTML=Object.entries(cats).map(([k,v])=>{let t=totals(v);return `<div class="item"><strong>${esc(k)}</strong><div class="row"><span>予定 ${yen(t.plan)}</span><span>実績 ${yen(t.actual)}</span></div>${v.slice(0,4).map(row).join('')}</div>`}).join('')||'<div class="empty">まだカテゴリがありません</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body>
</html>
